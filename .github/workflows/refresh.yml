# Keeps FINN's data fresh at zero infrastructure cost: ingest on GitHub's runners, commit the
# SQLite file, and let the host redeploy from the new commit.
#   - every 2 hours through the trading day: filings + scoring + alerts
#   - once after the close (16:15 IST): prices, fundamentals, and research for new transcripts
name: refresh-data

on:
  schedule:
    - cron: "15 3-15/2 * * 1-5"   # 08:45-20:45 IST, every 2h, Mon-Fri
    - cron: "45 10 * * 1-5"       # 16:15 IST, after the close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      - name: After the close: prices, fundamentals, research
        if: github.event.schedule == '45 10 * * 1-5' || github.event_name == 'workflow_dispatch'
        working-directory: backend
        run: |
          python -m finn.cli fundamentals
          python -m finn.cli fundamentals TRENT HAL DMART ASIANPAINT
          python -m finn.cli prices
          python -m finn.cli prices TRENT HAL DMART ASIANPAINT
          # Cached by source-document hash: only companies with a new transcript use any quota.
          if [ -n "$GEMINI_API_KEY" ]; then python -m finn.cli research TRENT HAL DMART ASIANPAINT LT INFY; fi

      - name: Filings, scoring, enrichment, alerts
        working-directory: backend
        run: |
          python -m finn.cli announcements --days 3
          python -m finn.cli process
          python -m finn.cli costs

      - name: Commit refreshed data
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add data/finn.db
          git diff --cached --quiet || git commit -m "data: refresh $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          git push
